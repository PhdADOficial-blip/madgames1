  <form>
    <h2>Compra de Passagem</h2>
    <div class="form-group">
      <label>Origem</label>
      <input type="text" placeholder="Cidade de origem">
    </div>

    <div class="form-group">
      <label>Destino</label>
      <input type="text" placeholder="Cidade de destino">
    </div>

    <div class="form-group">
      <label>Data da Viagem</label>
      <input type="date">
    </div>

    <div class="form-group">
      <label>Quantidade de Passagens</label>
      <select>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
      </select>
    </div>

    <button class="btn" type="submit">
      Comprar Passagem
    </button>
  </form>
